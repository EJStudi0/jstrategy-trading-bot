# Plantilla. Copiar a la carpeta del bot como logrotate.conf y cambiar RUTA_DEL_BOT por su ruta
# absoluta (logrotate no admite rutas relativas). La llama cron cada hora:
#   17 * * * * /usr/sbin/logrotate --state RUTA_DEL_BOT/.logrotate.state RUTA_DEL_BOT/logrotate.conf
RUTA_DEL_BOT/bot_stdout.log
RUTA_DEL_BOT/jorge_bot.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 50M
}
